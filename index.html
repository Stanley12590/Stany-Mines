<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mines Predictor Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        :root {
            --primary: #0a0e17;
            --secondary: #00f7ff;
            --success: #00ff9d;
            --danger: #ff0055;
            --warning: #ffcc00;
            --accent: #ff00ff;
            --glass: rgba(15, 22, 39, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }

        body {
            background: var(--primary);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Disable right click */
        body * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 70px;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 20px;
            background: var(--glass);
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px solid var(--secondary);
            position: relative;
        }

        .header h1 {
            color: var(--secondary);
            font-size: 24px;
            margin-bottom: 10px;
        }

        /* Cards */
        .card {
            background: var(--glass);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 247, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .card-title {
            color: var(--secondary);
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--secondary), #0066ff);
            color: white;
        }

        .btn-success {
            background: linear-gradient(45deg, var(--success), #00a86b);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(45deg, var(--warning), #ff9900);
            color: black;
        }

        .btn-danger {
            background: linear-gradient(45deg, var(--danger), #cc0044);
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Inputs */
        .input-control {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--secondary);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
        }

        /* Loading */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 14, 23, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            display: none;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid transparent;
            border-top-color: var(--secondary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--glass);
            border-left: 4px solid var(--secondary);
            padding: 15px;
            border-radius: 10px;
            max-width: 300px;
            z-index: 1001;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Back Button */
        .back-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            background: var(--glass);
            border: 2px solid var(--secondary);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            cursor: pointer;
        }

        /* WhatsApp Float */
        .whatsapp-float {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: #25D366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
        }

        /* Package Cards */
        .package-grid {
            display: grid;
            gap: 15px;
            margin: 20px 0;
        }

        .package-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            border: 2px solid;
            cursor: pointer;
            transition: all 0.3s;
        }

        .package-card:hover {
            transform: translateY(-5px);
        }

        .package-card.selected {
            border-color: var(--warning);
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
        }

        /* Status Badge */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-success {
            background: rgba(0, 255, 157, 0.2);
            color: var(--success);
        }

        .badge-danger {
            background: rgba(255, 0, 85, 0.2);
            color: var(--danger);
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
                padding-top: 60px;
            }
            
            .header h1 {
                font-size: 20px;
            }
            
            .whatsapp-float {
                width: 50px;
                height: 50px;
                font-size: 24px;
                bottom: 70px;
            }
        }
    </style>
</head>
<body>
    <!-- Back Button -->
    <div class="back-btn" onclick="goBack()">
        <i class="fas fa-arrow-left"></i>
    </div>

    <!-- WhatsApp Float -->
    <a href="https://wa.me/255xxxxxxxxx" class="whatsapp-float" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- Loading -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader"></div>
        <div id="loadingText" style="margin-top: 20px; color: var(--secondary);">Loading...</div>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification"></div>

    <!-- Main Container -->
    <div class="container" id="container">
        <!-- Content loaded dynamically -->
    </div>

    <script>
        // ==================== FIREBASE CONFIG ====================
        const firebaseConfig = {
            apiKey: "AIzaSyDtWAjmGIWVr3QGESAClBzRkQ5AZr5Zeys",
            authDomain: "stanybots.firebaseapp.com",
            projectId: "stanybots",
            storageBucket: "stanybots.firebasestorage.app",
            messagingSenderId: "381983533939",
            appId: "1:381983533939:web:201157399592c6389df306",
            measurementId: "G-W3C0C280BY"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ==================== GLOBAL STATE ====================
        const state = {
            user: null,
            userData: null,
            deviceId: null,
            currentScreen: 'welcome',
            selectedPackage: null
        };

        // ==================== UTILITY FUNCTIONS ====================
        function showLoading(message = 'Loading...') {
            document.getElementById('loadingText').textContent = message;
            document.getElementById('loadingOverlay').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.borderLeftColor = 
                type === 'success' ? '#00ff9d' : 
                type === 'error' ? '#ff0055' : 
                type === 'warning' ? '#ffcc00' : '#00f7ff';
            notification.style.display = 'block';
            setTimeout(() => notification.style.display = 'none', 3000);
        }

        function goBack() {
            const screens = ['welcome', 'username', 'main', 'payment', 'redeem', 'predictor'];
            const currentIndex = screens.indexOf(state.currentScreen);
            if (currentIndex > 0) {
                loadScreen(screens[currentIndex - 1]);
            }
        }

        // ==================== DEVICE MANAGEMENT ====================
        function getDeviceId() {
            let deviceId = localStorage.getItem('device_id');
            if (!deviceId) {
                deviceId = 'device_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('device_id', deviceId);
            }
            state.deviceId = deviceId;
            return deviceId;
        }

        // ==================== DATABASE AUTO-CREATION ====================
        async function autoCreateUser(userId) {
            try {
                const userRef = db.collection('users').doc(userId);
                const userDoc = await userRef.get();
                
                if (!userDoc.exists) {
                    await userRef.set({
                        username: '',
                        packageType: 'free',
                        freeTrialsUsed: 0,
                        lastTrialDate: null,
                        deviceId: state.deviceId,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        isActive: true,
                        totalPredictions: 0
                    });
                    console.log('User document auto-created');
                }
            } catch (error) {
                console.error('Error auto-creating user:', error);
            }
        }

        async function autoCreatePayment(paymentData) {
            try {
                await db.collection('payments').add({
                    ...paymentData,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                console.log('Payment document auto-created');
            } catch (error) {
                console.error('Error auto-creating payment:', error);
            }
        }

        // ==================== AUTHENTICATION ====================
        async function initializeAuth() {
            showLoading('Initializing...');
            
            // Get device ID
            getDeviceId();
            
            // Listen for auth state
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    state.user = user;
                    
                    // Auto-create user document if not exists
                    await autoCreateUser(user.uid);
                    
                    // Load user data
                    await loadUserData(user.uid);
                    
                    // Check screen
                    if (!state.userData.username) {
                        loadScreen('username');
                    } else {
                        loadScreen('main');
                    }
                } else {
                    // Sign in anonymously
                    try {
                        await auth.signInAnonymously();
                    } catch (error) {
                        showNotification('Authentication error: ' + error.message, 'error');
                    }
                }
                hideLoading();
            });
        }

        async function loadUserData(userId) {
            try {
                const userDoc = await db.collection('users').doc(userId).get();
                
                if (userDoc.exists) {
                    state.userData = userDoc.data();
                    
                    // Check package expiry
                    if (state.userData.packageExpiry) {
                        const expiry = state.userData.packageExpiry.toDate();
                        if (expiry < new Date()) {
                            // Package expired
                            await db.collection('users').doc(userId).update({
                                packageType: 'free',
                                packageExpiry: null
                            });
                            state.userData.packageType = 'free';
                        }
                    }
                }
            } catch (error) {
                console.error('Error loading user data:', error);
            }
        }

        // ==================== SCREEN MANAGEMENT ====================
        function loadScreen(screenName) {
            state.currentScreen = screenName;
            const container = document.getElementById('container');
            
            switch(screenName) {
                case 'welcome':
                    container.innerHTML = getWelcomeScreen();
                    break;
                case 'username':
                    container.innerHTML = getUsernameScreen();
                    break;
                case 'main':
                    container.innerHTML = getMainScreen();
                    break;
                case 'payment':
                    container.innerHTML = getPaymentScreen();
                    break;
                case 'redeem':
                    container.innerHTML = getRedeemScreen();
                    break;
                case 'predictor':
                    container.innerHTML = getPredictorScreen();
                    break;
            }
        }

        // ==================== SCREEN TEMPLATES ====================
        function getWelcomeScreen() {
            return `
                <div class="header">
                    <h1><i class="fas fa-gem"></i> MINES PREDICTOR PRO</h1>
                    <div style="color: #8a9bbd; font-size: 14px;">Advanced Prediction System</div>
                </div>
                
                <div class="card">
                    <div class="card-title">
                        <i class="fas fa-star"></i> WELCOME
                    </div>
                    <p style="margin-bottom: 20px; line-height: 1.6;">
                        Professional mines predictor with high accuracy.
                        Get safe predictions and maximize your wins.
                    </p>
                    
                    <button class="btn btn-primary" onclick="startFreeTrial()">
                        <i class="fas fa-play"></i> START FREE TRIAL
                    </button>
                    
                    <button class="btn btn-success" onclick="loadScreen('redeem')">
                        <i class="fas fa-gift"></i> REDEEM CODE
                    </button>
                </div>
                
                <div class="card">
                    <div class="card-title">
                        <i class="fas fa-crown"></i> PREMIUM PACKAGES
                    </div>
                    
                    <div class="package-grid">
                        <div class="package-card" onclick="selectPackage('week')" 
                             style="border-color: var(--success);">
                            <div style="text-align: center;">
                                <i class="fas fa-calendar-week" style="font-size: 30px; color: var(--success);"></i>
                                <div style="font-size: 24px; font-weight: bold; color: var(--success); margin: 10px 0;">
                                    3,000 TZS
                                </div>
                                <div>7 DAYS ACCESS</div>
                            </div>
                        </div>
                        
                        <div class="package-card" onclick="selectPackage('month')"
                             style="border-color: var(--secondary);">
                            <div style="text-align: center;">
                                <i class="fas fa-calendar-alt" style="font-size: 30px; color: var(--secondary);"></i>
                                <div style="font-size: 24px; font-weight: bold; color: var(--secondary); margin: 10px 0;">
                                    4,000 TZS
                                </div>
                                <div>30 DAYS ACCESS</div>
                            </div>
                        </div>
                        
                        <div class="package-card" onclick="selectPackage('lifetime')"
                             style="border-color: var(--accent);">
                            <div style="text-align: center;">
                                <i class="fas fa-infinity" style="font-size: 30px; color: var(--accent);"></i>
                                <div style="font-size: 24px; font-weight: bold; color: var(--accent); margin: 10px 0;">
                                    5,000 TZS
                                </div>
                                <div>LIFETIME ACCESS</div>
                            </div>
                        </div>
                    </div>
                    
                    <button class="btn btn-success" onclick="loadScreen('payment')">
                        <i class="fas fa-shopping-cart"></i> BUY PREMIUM
                    </button>
                </div>
                
                <div class="card" style="background: rgba(255,0,85,0.1);">
                    <p style="color: var(--danger);">
                        <i class="fas fa-exclamation-triangle"></i>
                        <strong>FREE TRIAL:</strong> 2 predictions per 24 hours
                    </p>
                </div>
            `;
        }

        function getUsernameScreen() {
            return `
                <div class="header">
                    <h1><i class="fas fa-user"></i> SET USERNAME</h1>
                </div>
                
                <div class="card">
                    <div class="card-title">
                        <i class="fas fa-id-card"></i> CHOOSE USERNAME
                    </div>
                    
                    <input type="text" id="usernameInput" class="input-control" 
                           placeholder="Enter your username" maxlength="20">
                    
                    <p style="color: #8a9bbd; font-size: 14px; margin-bottom: 20px;">
                        This username will be visible to admin.
                    </p>
                    
                    <button class="btn btn-success" onclick="saveUsername()">
                        <i class="fas fa-check"></i> SAVE USERNAME
                    </button>
                </div>
            `;
        }

        async function saveUsername() {
            const username = document.getElementById('usernameInput').value.trim();
            
            if (!username || username.length < 3) {
                showNotification('Username must be at least 3 characters', 'error');
                return;
            }
            
            try {
                showLoading('Saving username...');
                
                // Check if username exists
                const snapshot = await db.collection('users')
                    .where('username', '==', username)
                    .get();
                
                if (!snapshot.empty) {
                    showNotification('Username already taken', 'error');
                    return;
                }
                
                // Update user
                await db.collection('users').doc(state.user.uid).update({
                    username: username,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                state.userData.username = username;
                loadScreen('main');
                showNotification('Username saved successfully', 'success');
                
            } catch (error) {
                showNotification('Error saving username', 'error');
            } finally {
                hideLoading();
            }
        }

        function getMainScreen() {
            const isPremium = state.userData.packageType !== 'free';
            const trialsLeft = Math.max(0, 2 - (state.userData.freeTrialsUsed || 0));
            
            return `
                <div class="header">
                    <h1><i class="fas fa-user"></i> ${state.userData.username.toUpperCase()}</h1>
                    <div style="color: ${isPremium ? 'var(--success)' : 'var(--danger)'};">
                        STATUS: ${isPremium ? 'PREMIUM' : 'FREE TRIAL'}
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-title">
                        <i class="fas fa-chart-line"></i> ACCOUNT SUMMARY
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                        <div style="text-align: center; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 10px;">
                            <div style="font-size: 12px; color: #8a9bbd;">PACKAGE</div>
                            <div style="font-size: 18px; font-weight: bold; color: ${isPremium ? 'var(--success)' : 'var(--danger)'}">
                                ${state.userData.packageType.toUpperCase()}
                            </div>
                        </div>
                        
                        <div style="text-align: center; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 10px;">
                            <div style="font-size: 12px; color: #8a9bbd;">TRIALS LEFT</div>
                            <div style="font-size: 18px; font-weight: bold; color: var(--secondary)">
                                ${isPremium ? '∞' : trialsLeft}
                            </div>
                        </div>
                    </div>
                    
                    ${!isPremium ? `
                        <div style="padding: 15px; background: rgba(255,0,85,0.1); border-radius: 10px; margin-bottom: 20px;">
                            <p style="color: var(--danger);">
                                <i class="fas fa-exclamation-triangle"></i>
                                Free trial limit: ${state.userData.freeTrialsUsed || 0}/2 used today
                            </p>
                        </div>
                    ` : ''}
                    
                    <button class="btn btn-primary" onclick="startPredictor()" 
                            ${!isPremium && trialsLeft === 0 ? 'disabled style="opacity:0.5"' : ''}>
                        <i class="fas fa-rocket"></i> START PREDICTOR
                    </button>
                    
                    ${!isPremium ? `
                        <button class="btn btn-success" onclick="loadScreen('redeem')">
                            <i class="fas fa-gift"></i> REDEEM CODE
                        </button>
                        
                        <button class="btn btn-warning" onclick="loadScreen('payment')">
                            <i class="fas fa-shopping-cart"></i> BUY PREMIUM
                        </button>
                    ` : ''}
                </div>
            `;
        }

        function getPaymentScreen() {
            if (!state.selectedPackage) state.selectedPackage = 'week';
            
            const prices = {
                week: 3000,
                month: 4000,
                lifetime: 5000
            };
            
            return `
                <div class="header">
                    <h1><i class="fas fa-credit-card"></i> MAKE PAYMENT</h1>
                </div>
                
                <div class="card">
                    <div class="card-title">
                        <i class="fas fa-shopping-cart"></i> PAYMENT DETAILS
                    </div>
                    
                    <div style="text-align: center; padding: 20px; border: 2px solid var(--secondary); border-radius: 10px; margin-bottom: 20px;">
                        <div style="font-size: 32px; font-weight: bold; color: var(--secondary);">
                            ${prices[state.selectedPackage].toLocaleString()} TZS
                        </div>
                        <div style="color: #8a9bbd;">${state.selectedPackage.toUpperCase()} PACKAGE</div>
                    </div>
                    
                    <div>
                        <div style="color: var(--secondary); margin-bottom: 5px;">Phone Number</div>
                        <input type="tel" id="phoneNumber" class="input-control" 
                               placeholder="06xxxxxxx or 07xxxxxxx" pattern="[0-9]{9}">
                    </div>
                    
                    <button class="btn btn-success" onclick="processPayment()">
                        <i class="fas fa-lock"></i> PAY NOW
                    </button>
                    
                    <button class="btn btn-primary" onclick="loadScreen('main')" style="margin-top: 10px;">
                        <i class="fas fa-arrow-left"></i> BACK
                    </button>
                </div>
            `;
        }

        // ==================== PAYMENT PROCESSING ====================
        const HARAKA_API_KEY = 'hpk_fb763cc04e2feec29eb19041f75f54d0e6eb0067486caaae';
        const HARAKA_BASE_URL = 'https://harakapay.net/api/v1';

        async function processPayment() {
            const phoneInput = document.getElementById('phoneNumber');
            let phone = phoneInput.value.trim().replace(/\D/g, '');
            
            if (!phone || !(phone.startsWith('06') || phone.startsWith('07')) || phone.length !== 9) {
                showNotification('Enter valid phone (06xxxxxxx or 07xxxxxxx)', 'error');
                return;
            }
            
            const pkg = state.selectedPackage;
            const amount = pkg === 'week' ? 3000 : pkg === 'month' ? 4000 : 5000;
            const formattedPhone = '255' + phone.substring(1);
            
            try {
                showLoading('Processing payment...');
                
                // Call HarakaPay API
                const response = await fetch(`${HARAKA_BASE_URL}/collect`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': HARAKA_API_KEY
                    },
                    body: JSON.stringify({
                        phone: formattedPhone,
                        amount: amount,
                        description: `Mines Predictor ${pkg} Package`
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Auto-create payment document
                    await autoCreatePayment({
                        userId: state.user.uid,
                        username: state.userData.username,
                        phone: phone,
                        formattedPhone: formattedPhone,
                        amount: amount,
                        package: pkg,
                        orderId: result.order_id,
                        status: 'pending',
                        fee: result.fee || 0,
                        netAmount: result.net_amount || amount
                    });
                    
                    // Start checking status
                    checkPaymentStatus(result.order_id, pkg);
                    
                } else {
                    throw new Error(result.message || 'Payment failed');
                }
                
            } catch (error) {
                hideLoading();
                showNotification('Payment error: ' + error.message, 'error');
            }
        }

        async function checkPaymentStatus(orderId, packageType) {
            try {
                const response = await fetch(`${HARAKA_BASE_URL}/status/${orderId}`, {
                    headers: { 'X-API-Key': HARAKA_API_KEY }
                });
                
                const result = await response.json();
                
                if (result.success && result.payment.status === 'completed') {
                    // Payment successful
                    hideLoading();
                    
                    // Calculate expiry
                    const expiry = new Date();
                    const days = packageType === 'week' ? 7 : packageType === 'month' ? 30 : 9999;
                    expiry.setDate(expiry.getDate() + days);
                    
                    // Update user
                    await db.collection('users').doc(state.user.uid).update({
                        packageType: packageType,
                        packageExpiry: expiry,
                        freeTrialsUsed: 0,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    // Update payment
                    const snapshot = await db.collection('payments')
                        .where('orderId', '==', orderId)
                        .get();
                    
                    if (!snapshot.empty) {
                        await snapshot.docs[0].ref.update({
                            status: 'completed',
                            completedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                    
                    // Reload user data
                    await loadUserData(state.user.uid);
                    
                    showNotification('Payment successful! Premium activated.', 'success');
                    loadScreen('main');
                    
                } else if (result.success && result.payment.status === 'pending') {
                    setTimeout(() => checkPaymentStatus(orderId, packageType), 5000);
                } else {
                    throw new Error('Payment failed');
                }
                
            } catch (error) {
                hideLoading();
                showNotification('Payment status check failed', 'error');
            }
        }

        // ==================== FREE TRIAL ====================
        async function startFreeTrial() {
            if (!state.userData.username) {
                loadScreen('username');
                return;
            }
            
            const now = new Date();
            const lastTrial = state.userData.lastTrialDate ? 
                state.userData.lastTrialDate.toDate() : null;
            
            // Reset if 24 hours passed
            if (lastTrial && (now - lastTrial) >= 24 * 60 * 60 * 1000) {
                state.userData.freeTrialsUsed = 0;
                await db.collection('users').doc(state.user.uid).update({
                    freeTrialsUsed: 0
                });
            }
            
            if (state.userData.freeTrialsUsed >= 2) {
                showNotification('Free trial limit reached. Buy premium or try tomorrow.', 'error');
                return;
            }
            
            // Increment trial count
            state.userData.freeTrialsUsed = (state.userData.freeTrialsUsed || 0) + 1;
            await db.collection('users').doc(state.user.uid).update({
                freeTrialsUsed: state.userData.freeTrialsUsed,
                lastTrialDate: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            // Start predictor
            startPredictor();
        }

        // ==================== CODE REDEMPTION ====================
        function getRedeemScreen() {
            return `
                <div class="header">
                    <h1><i class="fas fa-gift"></i> REDEEM CODE</h1>
                </div>
                
                <div class="card">
                    <div class="card-title">
                        <i class="fas fa-key"></i> ENTER PREMIUM CODE
                    </div>
                    
                    <input type="text" id="premiumCode" class="input-control" 
                           placeholder="Enter premium code" style="text-transform: uppercase;">
                    
                    <p style="color: #8a9bbd; font-size: 14px; margin-bottom: 20px;">
                        Enter the premium code you purchased.
                        Code can be used only once per device.
                    </p>
                    
                    <button class="btn btn-success" onclick="redeemCode()">
                        <i class="fas fa-check"></i> REDEEM CODE
                    </button>
                    
                    <button class="btn btn-primary" onclick="loadScreen('main')" style="margin-top: 10px;">
                        <i class="fas fa-arrow-left"></i> BACK
                    </button>
                </div>
            `;
        }

        async function redeemCode() {
            const code = document.getElementById('premiumCode').value.trim().toUpperCase();
            
            if (!code) {
                showNotification('Please enter a code', 'error');
                return;
            }
            
            try {
                showLoading('Validating code...');
                
                // Check code
                const snapshot = await db.collection('premium_codes')
                    .where('code', '==', code)
                    .where('status', '==', 'active')
                    .get();
                
                if (snapshot.empty) {
                    throw new Error('Invalid or expired code');
                }
                
                const codeData = snapshot.docs[0].data();
                const codeId = snapshot.docs[0].id;
                
                // Check device lock
                if (codeData.deviceId && codeData.deviceId !== state.deviceId) {
                    throw new Error('Code already used on another device');
                }
                
                // Check expiry
                if (codeData.expiresAt && codeData.expiresAt.toDate() < new Date()) {
                    throw new Error('Code has expired');
                }
                
                // Update code
                await db.collection('premium_codes').doc(codeId).update({
                    status: 'used',
                    usedBy: state.user.uid,
                    usedByUsername: state.userData.username,
                    usedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    deviceId: state.deviceId
                });
                
                // Calculate expiry
                const expiry = new Date();
                const duration = codeData.duration || 30;
                expiry.setDate(expiry.getDate() + duration);
                
                // Update user
                await db.collection('users').doc(state.user.uid).update({
                    packageType: 'premium',
                    packageExpiry: expiry,
                    freeTrialsUsed: 0,
                    redeemedCode: code,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                // Reload user data
                await loadUserData(state.user.uid);
                
                hideLoading();
                showNotification('Code redeemed successfully!', 'success');
                loadScreen('main');
                
            } catch (error) {
                hideLoading();
                showNotification('Redemption failed: ' + error.message, 'error');
            }
        }

        // ==================== PREDICTOR ====================
        function startPredictor() {
            loadScreen('predictor');
        }

        function getPredictorScreen() {
            return `
                <div class="header">
                    <h1><i class="fas fa-gem"></i> MINES PREDICTOR</h1>
                    <div style="color: #8a9bbd;">Live Analysis</div>
                </div>
                
                <div class="card">
                    <div style="text-align: center; margin-bottom: 20px;">
                        <div style="font-size: 14px; color: var(--secondary);">PLAYER</div>
                        <div style="font-size: 18px; font-weight: bold;">${state.userData.username}</div>
                    </div>
                    
                    <div style="text-align: center; padding: 40px;">
                        <i class="fas fa-gem" style="font-size: 60px; color: var(--secondary);"></i>
                        <div style="margin-top: 20px; color: var(--secondary);">Predictor Loading...</div>
                    </div>
                    
                    <button class="btn btn-primary" onclick="loadScreen('main')">
                        <i class="fas fa-arrow-left"></i> BACK TO DASHBOARD
                    </button>
                </div>
            `;
        }

        // ==================== HELPER FUNCTIONS ====================
        function selectPackage(packageType) {
            state.selectedPackage = packageType;
            loadScreen('payment');
        }

        // ==================== INITIALIZATION ====================
        document.addEventListener('DOMContentLoaded', function() {
            initializeAuth();
            
            // Security - disable right click
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                showNotification('Action not allowed', 'error');
            });
            
            // Disable copy but allow paste
            document.addEventListener('copy', function(e) {
                e.preventDefault();
                showNotification('Copying disabled', 'error');
            });
            
            // Allow paste
            document.addEventListener('paste', function(e) {
                // Allow paste in input fields
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                    return;
                }
                e.preventDefault();
                showNotification('Paste not allowed here', 'error');
            });
        });
    </script>
</body>
</html>
